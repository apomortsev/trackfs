services:
  trackfs:
    container_name: "trackfs"
    image: "ghcr.io/apomortsev/trackfs:0.2.8"
    user: "${UID}:${GID}"
    security_opt:
      - "apparmor:unconfined"
    cap_add:
      - SYS_ADMIN
    ulimits:
      nofile:
        soft: 65535
        hard: 524288
    volumes:
      - "${SRC_ROOT}:${SRC_ROOT}:ro"
      - "${SRC_ROOT}/${SRC_PATH}:/src:ro"
      - "${SRC_ROOT}/${DST_PATH}:/dst:rshared"
    devices:
      - "/dev/fuse:/dev/fuse"
    network_mode: "none"
  